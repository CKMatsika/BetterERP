services:
  - type: web
    name: bettererp-backend
    env: node
    region: ohio
    rootDir: backend
    buildCommand: npm install && npm run build && npm run prisma:generate && npm run prisma:deploy && npm run db:seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bettererp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: static
    name: bettererp-frontend
    region: ohio
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bettererp-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: bettererp-db
    databaseName: bettererp
    user: bettererp
    region: ohio
